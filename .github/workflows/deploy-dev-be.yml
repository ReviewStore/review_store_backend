name: Deploy dev-be to GCP VM

on:
  push:
    branches:
      - dev-be

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ dev-be 브랜치 코드 자동 checkout
      - name: Checkout dev-be branch
        uses: actions/checkout@v4

      # 2️⃣ JDK 17 설치
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # 3️⃣ application-secret.yaml 생성
      - name: Create application-secret.yaml
        run: |
          echo "${{ secrets.APPLICATION_SECRET_YAML }}" \
          > src/main/resources/application-secret.yaml

      # 4️⃣ Gradle 빌드

      - name: Build with Gradle
        run: |
          chmod +x gradlew
          ./gradlew clean build -x test      

      # 5️⃣ JAR 이름 통일
      - name: Rename jar
        run: |
          mv build/libs/*SNAPSHOT.jar build/libs/app.jar

      # 6️⃣ JAR 전송
      - name: Copy jar to GCP VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.GCP_HOST }}
          username: ${{ secrets.GCP_USERNAME }}
          key: ${{ secrets.GCP_PRIVATE_KEY }}
          source: build/libs/app.jar
          target: /home/retrospection1234/spring-boot/review_store_backend/build/libs

      # 7️⃣ dev 서버 재시작
      - name: Restart dev server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GCP_HOST }}
          username: ${{ secrets.GCP_USERNAME }}
          key: ${{ secrets.GCP_PRIVATE_KEY }}
          script_stop: true
          script: |
            cd /home/retrospection1234/spring-boot/review_store_backend
            sudo fuser -k -n tcp 8080 || true
            nohup java -jar build/libs/app.jar > output.log 2>&1 &
